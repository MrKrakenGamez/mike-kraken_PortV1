# Configuración de Decap CMS
backend:
  name: github
  repo: TU_USUARIO/TU_REPOSITORIO # TODO: tu repositorio real de GitHub (usuario/repo)
  branch: main

# En localhost, el CMS edita tus archivos directamente (sin login).
# Requiere ejecutar en otra terminal: npx decap-server
local_backend: true

media_folder: "public/uploads/blog"
public_folder: "/uploads/blog"
locale: "es"

collections:
  - name: blog_es
    label: "Blog · Español"
    label_singular: "Artículo"
    folder: "src/content/blog/es"
    create: true
    extension: "md"
    format: "frontmatter"
    # El nombre del archivo sale del campo "urlSlug": usa el MISMO en ES y EN para enlazar traducciones
    slug: "{{fields.urlSlug}}"
    summary: "{{title}} · {{pubDate}}"
    sortable_fields: ["pubDate", "title"]
    fields: &campos_blog
      - { label: "Slug (URL)", name: "urlSlug", widget: "string", hint: "Minúsculas y guiones, igual en ES y EN. Ej: mi-primer-articulo" }
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Descripción", name: "description", widget: "text", hint: "1–2 frases: se usa en la tarjeta y en buscadores." }
      - { label: "Fecha de publicación", name: "pubDate", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { label: "Etiquetas", name: "tags", widget: "list", default: [], required: false }
      - { label: "Borrador", name: "draft", widget: "boolean", default: false, hint: "Los borradores no se publican." }
      - { label: "Imagen de portada", name: "cover", widget: "image", required: false }
      - { label: "Texto alternativo de la portada", name: "coverAlt", widget: "string", required: false }
      - { label: "Contenido", name: "body", widget: "markdown" }
        - name: testimonios
    label: "Testimonios"
    label_singular: "Testimonio"
    folder: "src/content/testimonios"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{slug}}"
    summary: "{{nombre}} · {{cargo}}"
    media_folder: "public/uploads/testimonios"
    public_folder: "/uploads/testimonios"
    fields:
      - { label: "Nombre", name: "nombre", widget: "string" }
      - { label: "Cargo o relación", name: "cargo", widget: "string", hint: "Ej: Líder de proyecto, Product Owner, colega de equipo." }
      - { label: "Organización", name: "organizacion", widget: "string", required: false, hint: "Si no tienes permiso para nombrar la empresa, usa una descripción genérica (ej: «Cliente del sector salud»)." }
      - { label: "Perfil de LinkedIn (opcional)", name: "enlace", widget: "string", required: false }
      - { label: "Foto (opcional)", name: "foto", widget: "image", required: false }
      - { label: "Orden", name: "orden", widget: "number", value_type: "int", default: 1 }
      - { label: "Borrador", name: "draft", widget: "boolean", default: true, hint: "Desmárcalo solo cuando la persona haya autorizado publicar su recomendación." }
      - { label: "Cita en español", name: "cita_es", widget: "text", required: false }
      - { label: "Cita en inglés", name: "cita_en", widget: "text", required: false, hint: "Debe haber al menos una de las dos citas." }

  - name: blog_en
    label: "Blog · English"
    label_singular: "Article"
    folder: "src/content/blog/en"
    create: true
    extension: "md"
    format: "frontmatter"
    slug: "{{fields.urlSlug}}"
    summary: "{{title}} · {{pubDate}}"
    sortable_fields: ["pubDate", "title"]
    fields: *campos_blog